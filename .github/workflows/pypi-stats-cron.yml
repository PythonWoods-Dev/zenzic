name: PyPI Download Statistics Automation

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    name: Fetch & Commit PyPI Stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Fetch PyPI Download Metrics
        run: |
          uv run python scripts/fetch_pypi_stats.py

      - name: Commit & Push Dataset Updates
        run: |
          if [ -n "$(git status --porcelain docs/assets/data/pypi-stats.json)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/assets/data/pypi-stats.json
            git commit -m "docs(stats): update daily PyPI download metrics [skip ci]"
            git push origin main
          else
            echo "No PyPI stats changes detected."
          fi
