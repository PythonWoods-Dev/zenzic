name: Zenzic Core CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    # `labeled` is included so applying the ci:full-matrix label is itself a
    # trigger: a maintainer marks a PR as ready to merge with the label and the
    # full matrix runs on that event, with no extra push required.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Movable full-matrix gate (2026-09-07). The full matrix had been restored
        # on 2026-09-06 as a one-time pre-merge check and then left running on
        # every push, which is the cost the earlier narrowing existed to avoid.
        # Now:
        #   ordinary PR push            -> ubuntu-latest / 3.14 only
        #   PR labelled ci:full-matrix  -> full matrix (the pre-merge signal)
        #   workflow_dispatch           -> full matrix (on demand)
        #   push to main                -> full matrix (post-merge safety net)
        # The only Windows issue on record (torture-test timing jitter, PR #193)
        # was fixed by widening thresholds still live in tests/test_rules.py; if a
        # full-matrix run surfaces a real failure, log it rather than blocking.
        include: >-
          ${{ fromJSON(
                (github.event_name == 'push'
                 || github.event_name == 'workflow_dispatch'
                 || contains(github.event.pull_request.labels.*.name, 'ci:full-matrix'))
                && '[{"os":"ubuntu-latest","python-version":"3.14"},{"os":"ubuntu-latest","python-version":"3.10"},{"os":"windows-latest","python-version":"3.10"}]'
                || '[{"os":"ubuntu-latest","python-version":"3.14"}]'
              ) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: taiki-e/install-action@ea85faa6acd705ad6d40586db99f1a70b09c2929 # just

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups --all-extras --frozen

      # pre-commit enforces this too, but only on staged files and only when
      # it is not bypassed; a formatter check that never runs in CI let six
      # unformatted files reach main. Authoritative version is pinned in
      # pyproject.toml to match .pre-commit-config.yaml's ruff-pre-commit rev.
      - name: Formatting check (ruff format)
        run: uv run ruff format --check src tests

      - name: Run unit tests (coverage enforced, fail_under=80)
        run: just test-cov

      # The credential scanner is the one path where a test that stops catching a
      # regression is a security problem rather than a coverage statistic. The
      # harness was configured in pyproject.toml but never invoked anywhere, so no
      # score had ever been produced; this step is what makes it real.
      # mutmut has no native Windows support at all (upstream tracks this at
      # https://github.com/boxed/mutmut/issues/397) -- this is not a scoping
      # choice, the tool cannot run there. Restricted to Linux rather than
      # skipped everywhere: the gate still runs at full strength on every PR
      # via the ubuntu-latest slots, so coverage of the credential scanner is
      # unchanged; only the platform that cannot execute the tool is excused.
      - name: Mutation gate (credential scanner)
        if: runner.os == 'Linux'
        run: just mutation

      - name: Run Zenzic Quality Gate
        run: uv run zenzic check all --strict --format github-annotations --ci

      - name: Build Docs
        run: uv run mkdocs build --strict

      - name: Redirects structure tripwire
        run: python3 scripts/check_redirects_structure.py

      - name: Blog link schedule gate
        run: uv run python scripts/check_blog_link_schedule.py

      - name: Verify Badge Freshness
        run: uv run zenzic score --check-stamp --ci
