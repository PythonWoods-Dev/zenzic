name: Zenzic Core CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # TEMPORARY EXCLUSION: Windows and Python 3.14 are temporarily excluded
        # to accelerate CI cycle and isolate environment-specific runners.
        # Original configuration:
        #   os: [ubuntu-latest, windows-latest]
        #   python-version: ["3.10", "3.14"]
        #   exclude:
        #     - os: windows-latest
        #       python-version: "3.14"
        os: [ubuntu-latest]
        python-version: ["3.10"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: taiki-e/install-action@ea85faa6acd705ad6d40586db99f1a70b09c2929 # just

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups --all-extras --frozen

      # pre-commit enforces this too, but only on staged files and only when
      # it is not bypassed; a formatter check that never runs in CI let six
      # unformatted files reach main. Authoritative version is pinned in
      # pyproject.toml to match .pre-commit-config.yaml's ruff-pre-commit rev.
      - name: Formatting check (ruff format)
        run: uv run ruff format --check src tests

      - name: Run unit tests (coverage enforced, fail_under=80)
        run: just test-cov

      # The credential scanner is the one path where a test that stops catching a
      # regression is a security problem rather than a coverage statistic. The
      # harness was configured in pyproject.toml but never invoked anywhere, so no
      # score had ever been produced; this step is what makes it real.
      - name: Mutation gate (credential scanner)
        run: just mutation

      - name: Run Zenzic Quality Gate
        run: uv run zenzic check all --strict --format github-annotations --ci

      - name: Build Docs
        run: uv run mkdocs build --strict

      - name: Redirects structure tripwire
        run: python3 scripts/check_redirects_structure.py

      - name: Verify Badge Freshness
        run: uv run zenzic score --check-stamp --ci
