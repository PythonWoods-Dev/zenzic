# This workflow used to be twenty-two lines, one step, and two `echo` statements
# announcing that the repository relied on GitHub's native secret scanning —
# which was disabled on every repository in this ecosystem. It reported `success`
# on every commit and had never scanned anything: a green check named `Scan`, in a
# credential scanner's own repository.
#
# It now runs the project's own scanner over every tracked file. The two layers are
# deliberately different and neither subsumes the other: this one applies Zenzic's
# signature set to the checkout, and GitHub's native scanning (enabled on all four
# repositories on 2026-09-12) applies its provider list to the full history.

name: Zenzic Core Secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen

      # Nothing is excluded from the scan itself. The deliberate fixtures — the Z201
      # lab scenario and the hero screenshot specimen — are forgiven afterwards, by
      # path AND secret type together, so a new credential in a fixture file and a
      # different kind of credential in the same fixture file both still fail. A
      # directory-level exclusion would be the shape this project already closed once
      # at the hook level, where a flag narrowed a scan to an always-empty set.
      #
      # The script self-tests before rendering any verdict, and one of its cases exists
      # solely to assert that the allowlist is not behaving as a path-level bypass.
      - name: Scan every tracked file for credentials
        run: uv run python scripts/ci_secret_scan.py
