name: Zenzic Docs Release Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: release-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Build Docs
        run: |
          uv run --extra docs mkdocs build --strict

      - name: Set artifact name
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=docs-build-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=docs-build-run-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive build output
        run: tar -czf "${{ steps.vars.outputs.name }}.tar.gz" site

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.vars.outputs.name }}
          path: ${{ steps.vars.outputs.name }}.tar.gz
          retention-days: 30

      - name: Publish GitHub release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: ${{ steps.vars.outputs.name }}.tar.gz
          generate_release_notes: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=zenzic-doc
          wranglerVersion: "3.90.0"
