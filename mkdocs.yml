theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/svg/zenzic-icon.svg
  favicon: assets/brand/svg/zenzic-icon.svg
  language: en
  font: false
  palette:
    # No `media:` on either entry: Material evaluates media queries in order to
    # pick a first-visit default, so any `(prefers-color-scheme: ...)` here would
    # hand the choice to the visitor's OS. Dark is the default unconditionally;
    # the toggle still reaches light and the choice is then remembered.
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.breadcrumbs
    - navigation.path
    - navigation.top
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.code.copy

extra:
  # ADR-037: No hardcoded SemVer in any .html or .md source.
  # CI pipeline passes the current version at build time, e.g.:
  #   uv run mkdocs build --extra zenzic_version=0.14.1
  zenzic_version: "0.30.0"  # release sync
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PythonWoods/zenzic
      name: Zenzic on GitHub
    - icon: fontawesome/brands/hashnode
      link: https://hashnode.com/@Pythonwoods
      name: PythonWoods on Hashnode
    - icon: fontawesome/solid/screwdriver-wrench
      link: https://devtool.io
      name: Featured on DevTool.io
    - icon: fontawesome/solid/rss
      link: /blog/rss.xml
      name: RSS Feed
    - icon: fontawesome/solid/square-rss
      link: /blog/rss-updated.xml
      name: RSS Feed (Recently Updated)

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - blog:
      blog_dir: blog
      archive: true
      categories: true
      pagination: true
      pagination_per_page: 10
      pagination_url_format: "page/{page}"
  - rss:
      match_path: "blog/posts/.*"
      date_from_meta:
        as_creation: date
      use_material_blog: true
      use_material_social_cards: true
      abstract_delimiter: <!-- more -->
      abstract_chars_count: 500
      pretty_print: true
      image: https://zenzic.dev/assets/brand/svg/zenzic-icon.svg
      feed_description: "Engineering insights, release notes and documentation quality guides from the Zenzic team."
      feed_ttl: 1440
      stylesheet: /blog/rss.xsl
      feeds_filenames:
        rss_created: blog/rss.xml
        rss_updated: blog/rss-updated.xml
  - minify:
      minify_html: true
      minify_css: true
      minify_js: false

# MkDocs strict-mode link validation.
# tutorials/examples/ pages intentionally contain extensionless/malformed links
# to demonstrate Zenzic's own rule findings (Z101, Z103, etc.) — docs-as-code
# test fixtures. Suppress INFO-level warnings that would abort --strict build.
validation:
  links:
    unrecognized_links: ignore
  nav:
    not_found: ignore
