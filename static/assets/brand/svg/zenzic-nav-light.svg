<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90">
  <defs>
    <!-- Gradienti moderni Tech -->
    <linearGradient id="zenzic-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="zenzic-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="zenzic-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <filter id="shadow-nav-l" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4338ca" flood-opacity="0.25"/>
    </filter>

    <clipPath id="br-clip-nav-light">
      <rect x="103" y="103" width="97" height="97" rx="12"/>
    </clipPath>
    <mask id="slash-cut-nav-light">
      <rect x="0" y="0" width="200" height="200" fill="white"/>
      <polygon points="166,-5 138,-5 34,205 62,205" fill="black"/>
    </mask>
  </defs>

  <!-- Icona ridotta e allineata a sinistra -->
  <g transform="translate(5, 5) scale(0.4)" filter="url(#shadow-nav-l)">
    <g mask="url(#slash-cut-nav-light)">
      <rect x="0" y="0" width="97" height="97" rx="12" fill="url(#zenzic-cyan)"/>
      <rect x="103" y="0" width="97" height="97" rx="12" fill="url(#zenzic-indigo)"/>
      <rect x="0" y="103" width="97" height="97" rx="12" fill="url(#zenzic-indigo)"/>
      <g clip-path="url(#br-clip-nav-light)">
        <polygon points="103,103 200,103 200,125 155,200 103,200" fill="url(#zenzic-dark)"/>
      </g>
    </g>
  </g>

  <!-- Testo scuro per sfondo chiaro -->
  <text x="100" y="62" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="48" fill="#0f172a" letter-spacing="-1.5">Zenzic</text>
</svg>
