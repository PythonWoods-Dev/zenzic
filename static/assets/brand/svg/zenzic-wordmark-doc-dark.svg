<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" width="700" height="120">
  <defs>
    <!-- Gradienti moderni Tech -->
    <linearGradient id="zenzic-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="zenzic-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="zenzic-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <filter id="shadow-doc-d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4338ca" flood-opacity="0.25"/>
    </filter>

    <clipPath id="br-clip-wmdd">
      <rect x="103" y="103" width="97" height="97" rx="12"/>
    </clipPath>
    <mask id="slash-cut-wmdd">
      <rect x="0" y="0" width="200" height="200" fill="white"/>
      <polygon points="166,-5 138,-5 34,205 62,205" fill="black"/>
    </mask>
  </defs>

  <!-- Icon 100x100, vertically centred in 120px canvas -->
  <g transform="translate(10, 10) scale(0.5)" filter="url(#shadow-doc-d)">
    <g mask="url(#slash-cut-wmdd)">
      <rect x="0" y="0" width="97" height="97" rx="12" fill="url(#zenzic-cyan)"/>
      <rect x="103" y="0" width="97" height="97" rx="12" fill="url(#zenzic-indigo)"/>
      <rect x="0" y="103" width="97" height="97" rx="12" fill="url(#zenzic-indigo)"/>
      <g clip-path="url(#br-clip-wmdd)">
        <polygon points="103,103 200,103 200,125 155,200 103,200" fill="url(#zenzic-dark)"/>
      </g>
    </g>
  </g>

  <!-- "Zenzic" — light for dark backgrounds -->
  <text x="125" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#f8fafc" letter-spacing="-1.5">Zenzic</text>

  <!-- "/" separator — muted -->
  <text x="308" y="67" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="300" font-size="52" fill="#64748b">/</text>

  <!-- "doc" — sky accent (brand palette, dark-mode) -->
  <text x="333" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#38bdf8" letter-spacing="-1.5">doc</text>

  <!-- Tagline -->
  <text x="127" y="93" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="3">THE OFFICIAL DOCUMENTATION PORTAL</text>
</svg>
