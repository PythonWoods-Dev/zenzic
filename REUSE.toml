version = 1

# ── JSON files (no comment syntax) ───────────────────────────────────────────
# All other source/config files (*.py, *.toml, *.yml, *.yaml, justfile, etc.)
# carry SPDX headers inline. Only files that cannot contain comments are
# listed here.

[[annotations]]
path = ["scripts/external-corpus-pin.json", ".zenzic-score.json", "coverage.json", ".markdownlint.json", "zenzic-output.schema.json", "zenzic-baseline.schema.json", ".zenzic-baseline.json"]
SPDX-FileCopyrightText = "2026 PythonWoods <dev@pythonwoods.dev>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# Generated terminal blocks: real `zenzic lab` output, captured by
# scripts/generate_lab_blocks.py and included into the family index pages with
# pymdownx.snippets. Annotated here rather than headed inline, because a header
# in the file would be a line the parity test compares against real CLI output
# and no command prints it.
path = "snippets/lab-*.txt"
SPDX-FileCopyrightText = "2026 PythonWoods <dev@pythonwoods.dev>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "zenzic.code-workspace"
SPDX-FileCopyrightText = "2026 PythonWoods <dev@pythonwoods.dev>"
SPDX-License-Identifier = "Apache-2.0"

# ── Generated lock file ───────────────────────────────────────────────────────

[[annotations]]
path = ["uv.lock", "package.json", "package-lock.json"]
SPDX-FileCopyrightText = "2026 PythonWoods <dev@pythonwoods.dev>"
SPDX-License-Identifier = "Apache-2.0"

# ── Binary assets ─────────────────────────────────────────────────────────────
# Only the project's own binaries. This block once covered `docs/assets/**` and
# so declared the vendored fonts and the compiled Tailwind bundle as
# PythonWoods/Apache-2.0. Every other file under docs/assets/ declares itself
# (an inline header or a `.license` sidecar); third-party files are annotated
# one by one below, never by a directory glob.

[[annotations]]
path = "docs/assets/demo/**"
SPDX-FileCopyrightText = "2026 PythonWoods <dev@pythonwoods.dev>"
SPDX-License-Identifier = "Apache-2.0"

# ── Third-party files bundled in the repository ───────────────────────────────

[[annotations]]
# Roboto 3.015, subset by scripts/regenerate_fonts.py from web/static/ of the
# release asset Roboto_v3.015.zip (googlefonts/roboto-classic tag v3.015,
# SHA-256 pinned in the script). Name IDs 0, 13 and 14 are upstream's:
# "Copyright 2011 The Roboto Project Authors
# (https://github.com/googlefonts/roboto-classic)", the OFL 1.1 description and
# "https://openfontlicense.org". Upstream license:
# https://github.com/googlefonts/roboto-classic/blob/v3.015/OFL.txt
path = ["docs/assets/fonts/roboto-300-*.woff2", "docs/assets/fonts/roboto-400-*.woff2",
        "docs/assets/fonts/roboto-700-*.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2011 The Roboto Project Authors (https://github.com/googlefonts/roboto-classic)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
# Roboto Mono 3.001, subset by scripts/regenerate_fonts.py from fonts/ttf/ of
# googlefonts/robotomono at tag v3.001 (111eb14e, SHA-256 of each file pinned in
# the script). Name IDs 0, 13 and 14 are upstream's: "Copyright 2015 The Roboto
# Mono Project Authors (https://github.com/googlefonts/robotomono)", the OFL 1.1
# description and "https://openfontlicense.org". Upstream license:
# https://github.com/googlefonts/robotomono/blob/v3.001/OFL.txt
path = "docs/assets/fonts/roboto-mono-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2015 The Roboto Mono Project Authors (https://github.com/googlefonts/robotomono)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
# The OASIS SARIF 2.1.0 JSON schema, unmodified: byte-identical (SHA-256
# c3b4bb2d…, pinned by tests/test_sarif_schema_fixture_is_the_oasis_file.py) to
# https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json,
# the schema of SARIF v2.1.0 Plus Errata 01 (OASIS Standard incorporating
# Approved Errata, 28 August 2023), which the v2.1.0 "Latest stage" page names.
# Its notice is the Notices section of that deliverable. Not authored by
# PythonWoods.
path = "tests/fixtures/sarif-2.1.0-schema.json"
precedence = "override"
SPDX-FileCopyrightText = "2023 OASIS Open"
SPDX-License-Identifier = "LicenseRef-OASIS-Notice"

# ── Examples (fixture data: MDX, MD, JSON, lock files — cannot have inline) ──

[[annotations]]
path = "examples/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 PythonWoods <dev@pythonwoods.dev>"
SPDX-License-Identifier = "Apache-2.0"

# ── Root Markdown prose ───────────────────────────────────────────────────────
# Markdown supports comments but inline SPDX would appear in rendered output.

[[annotations]]
path = ["README.md", "CHANGELOG.md",
        "CHANGELOG.archive.md",
        "CONTRIBUTING.md",
        "SECURITY.md", "CODE_OF_CONDUCT.md", "RELEASE.md"]
SPDX-FileCopyrightText = "2026 PythonWoods <dev@pythonwoods.dev>"
SPDX-License-Identifier = "Apache-2.0"

# ── Extension-less files ──────────────────────────────────────────────────────

[[annotations]]
path = ["NOTICE", "LICENSE"]
SPDX-FileCopyrightText = "2026 PythonWoods <dev@pythonwoods.dev>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "tests/sandboxes/readme_capture/docs/assets/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 PythonWoods <dev@pythonwoods.dev>"
SPDX-License-Identifier = "Apache-2.0"
