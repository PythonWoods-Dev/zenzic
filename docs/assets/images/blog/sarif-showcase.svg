    <line x1="0" y1="180" x2="1020" y2="180"/>
    <line x1="0" y1="270" x2="1020" y2="270"/>
    <line x1="0" y1="360" x2="1020" y2="360"/>
    <line x1="0" y1="450" x2="1020" y2="450"/>
    <line x1="170" y1="0" x2="170" y2="540"/>
    <line x1="340" y1="0" x2="340" y2="540"/>
    <line x1="510" y1="0" x2="510" y2="540"/>
    <line x1="680" y1="0" x2="680" y2="540"/>
    <line x1="850" y1="0" x2="850" y2="540"/>
