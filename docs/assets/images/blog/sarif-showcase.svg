        <circle cx="16" cy="17" r="4" fill="#f85149"/>
        <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Forbidden content (Z617)</text>
        <rect x="284" y="7" width="56" height="20" rx="10" fill="#4c1d1a" stroke="#b62324" stroke-width="1"/>
        <text x="296" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ff7b72">ERROR</text>
        <!-- Body -->
        <text x="16" y="56" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#58a6ff">docs/security/policies.md:88</text>
        <text x="16" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#e6edf3">Matches policy regex <tspan font-family="'SFMono-Regular', Consolas, monospace" fill="#ff7b72">'(?i)\bconfidential\b'</tspan>.</text>
        <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Category: <tspan font-weight="600" fill="#e6edf3">Governance (-2.0 pts)</tspan></text>
        <!-- Footer link -->
        <text x="16" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#58a6ff">View rule documentation (Z617) →</text>
      </g>

      <!-- Bottom Status Pill -->
      <g transform="translate(0, 385)">
        <rect width="352" height="30" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1"/>
        <circle cx="16" cy="15" r="4" fill="#3fb950"/>
        <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#3fb950">Deterministic Quality Gate Passed</text>
        <text x="260" y="19" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" fill="#e6edf3">DQS: 98/100</text>
