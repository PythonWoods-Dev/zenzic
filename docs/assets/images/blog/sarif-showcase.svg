      <g transform="translate(0, 26)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" line-height="1.5">
        <text y="18" fill="#e6edf3">{</text>
        <text y="36" fill="#e6edf3">  <tspan fill="#7ee787">"$schema"</tspan>: <tspan fill="#a5d6ff">"https://json.schemastore.org/sarif-2.1.0.json"</tspan>,</text>
        <text y="54" fill="#e6edf3">  <tspan fill="#7ee787">"version"</tspan>: <tspan fill="#a5d6ff">"2.1.0"</tspan>,</text>
        <text y="72" fill="#e6edf3">  <tspan fill="#7ee787">"runs"</tspan>: [{</text>
        <text y="90" fill="#e6edf3">    <tspan fill="#7ee787">"tool"</tspan>: {</text>
        <text y="108" fill="#e6edf3">      <tspan fill="#7ee787">"driver"</tspan>: { <tspan fill="#7ee787">"name"</tspan>: <tspan fill="#a5d6ff">"zenzic"</tspan>, <tspan fill="#7ee787">"version"</tspan>: <tspan fill="#a5d6ff">"0.30.0"</tspan>, <tspan fill="#7ee787">"rules"</tspan>: [</text>
        <text y="126" fill="#e6edf3">        { <tspan fill="#7ee787">"id"</tspan>: <tspan fill="#a5d6ff">"Z513"</tspan>, <tspan fill="#7ee787">"shortDescription"</tspan>: { <tspan fill="#7ee787">"text"</tspan>: <tspan fill="#a5d6ff">"DUPLICATE_HEADING"</tspan> } },</text>
        <text y="144" fill="#e6edf3">        { <tspan fill="#7ee787">"id"</tspan>: <tspan fill="#a5d6ff">"Z617"</tspan>, <tspan fill="#7ee787">"shortDescription"</tspan>: { <tspan fill="#7ee787">"text"</tspan>: <tspan fill="#a5d6ff">"FORBIDDEN_CONTENT"</tspan> } }</text>
        <text y="162" fill="#e6edf3">      ]}</text>
        <text y="180" fill="#e6edf3">    },</text>
        <text y="198" fill="#e6edf3">    <tspan fill="#7ee787">"results"</tspan>: [</text>
        <text y="216" fill="#e6edf3">      {</text>
        <text y="234" fill="#e6edf3">        <tspan fill="#7ee787">"ruleId"</tspan>: <tspan fill="#a5d6ff">"Z513"</tspan>, <tspan fill="#7ee787">"level"</tspan>: <tspan fill="#ffa657">"warning"</tspan>,</text>
        <text y="252" fill="#e6edf3">        <tspan fill="#7ee787">"message"</tspan>: { <tspan fill="#7ee787">"text"</tspan>: <tspan fill="#a5d6ff">"Duplicate heading '# Setup Guide' detected"</tspan> },</text>
        <text y="270" fill="#e6edf3">        <tspan fill="#7ee787">"locations"</tspan>: [{</text>
        <text y="288" fill="#e6edf3">          <tspan fill="#7ee787">"physicalLocation"</tspan>: {</text>
        <text y="306" fill="#e6edf3">            <tspan fill="#7ee787">"artifactLocation"</tspan>: { <tspan fill="#7ee787">"uri"</tspan>: <tspan fill="#a5d6ff">"docs/setup.md"</tspan> },</text>
        <text y="324" fill="#e6edf3">            <tspan fill="#7ee787">"region"</tspan>: { <tspan fill="#7ee787">"startLine"</tspan>: <tspan fill="#79c0ff">42</tspan>, <tspan fill="#7ee787">"startColumn"</tspan>: <tspan fill="#79c0ff">1</tspan> }</text>
        <text y="342" fill="#e6edf3">          }</text>
        <text y="360" fill="#e6edf3">        }]</text>
        <text y="378" fill="#e6edf3">      }</text>
        <text y="396" fill="#e6edf3">    ]</text>
        <text y="414" fill="#e6edf3">  }]</text>
      </g>
    </g>

