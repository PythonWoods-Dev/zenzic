        <rect width="352" height="175" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <!-- Header -->
        <rect width="352" height="34" rx="8" fill="#21262d"/>
        <rect y="26" width="352" height="8" fill="#21262d"/>
        <circle cx="16" cy="17" r="4" fill="#d29922"/>
        <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Duplicate heading (Z513)</text>
