        <text x="282" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#e3b341">WARNING</text>
        <!-- Body -->
        <text x="16" y="56" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#58a6ff">docs/setup.md:42</text>
        <text x="16" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#e6edf3">Ambiguous anchor collision <tspan font-family="'SFMono-Regular', Consolas, monospace" fill="#d2a8ff">#setup-guide_1</tspan>.</text>
        <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Emitted by tool: <tspan font-weight="600" fill="#e6edf3">zenzic v0.30.0</tspan></text>
        <!-- Suggestion snippet -->
        <rect x="16" y="108" width="320" height="32" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
        <text x="24" y="128" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#3fb950">+ ## Quick Installation Guide</text>
        <!-- Footer link -->
        <text x="16" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#58a6ff">View rule documentation (Z513) →</text>
      </g>

      <!-- Alert Card 2 (Error Z617) -->
      <g transform="translate(0, 220)">
        <rect width="352" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <!-- Header -->
