    <circle cx="24" cy="23" r="6" fill="#f85149" opacity="0.85"/>
    <circle cx="44" cy="23" r="6" fill="#d29922" opacity="0.85"/>
    <circle cx="64" cy="23" r="6" fill="#3fb950" opacity="0.85"/>

    <!-- CLI & Pipe Specification -->
    <g transform="translate(92, 14)">
      <text font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#79c0ff">$ zenzic check all --format sarif</text>
      <text font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#8b949e" x="270">|</text>
      <text font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#d2a8ff" x="286">github/codeql-action/upload-sarif@v3</text>
      <rect x="730" y="-1" width="124" height="20" rx="10" fill="#1f2937" stroke="#388bfd" stroke-width="1"/>
      <text x="740" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#58a6ff">SARIF OASIS Standard</text>
