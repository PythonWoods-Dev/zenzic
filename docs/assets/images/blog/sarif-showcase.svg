      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1">STANDARDIZED SARIF v2.1.0 JSON PAYLOAD</text>

