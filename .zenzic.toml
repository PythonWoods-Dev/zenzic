# placeholder_patterns = []

# Precedence: .zenzic.toml is shared baseline; .zenzic.local.toml overrides locally.
# Keep secrets and workstation-only values in .zenzic.local.toml.

# --- PROJECT IDENTITY ---
# [project]
# name = "zenzic" # Used for personalized CLI Governance headers

# --- CORE SETTINGS ---
# ---------------------------------------------------------------------------
# docs_dir
# ---------------------------------------------------------------------------
# The relative path to your documentation root.
#
# BEHAVIOR:
#   - If commented out (default), Zenzic uses "docs" as the documentation root.
#   - Set to "." to scan the entire repository (L1 system exclusions apply).
#
# DEFAULT: "docs"
#
# docs_dir = "."

strict = true
# fail_under = 100 - suppression_cap, the relation the generated configuration states
# (fail_under <= 100 - suppression_cap). With the cap declared below at 4 this is 96: a
# higher floor would fail the project on the debt it declares, with no finding in sight.
fail_under = 96
max_sentence_length = 50
# exit_zero = false
# respect_vcs_ignore = true

excluded_external_urls = []

# Theme assets (favicon, logos, fonts) consumed by the site's own CSS/HTML
# templates, never referenced from a Markdown page — previously kept quiet
# only as a side effect of docs/how-to/use-brand-system.md's own link list,
# which was deleted as brand-identity content out of scope for a technical
# tool's public docs (see V031_CROSS_REPO_BUG_RESOLUTION_SPRINT addendum).
excluded_asset_dirs = ["overrides", "brand", "fonts"]
excluded_assets = ["favicon.ico"]


# Z204 Privacy Gate — terms that must never appear in published docs.
# forbidden_patterns = []

# --- EXCLUSION ZONES (Full bypass — use sparingly) ---
# The blog feeds are generated at build time and live at the site root, so no
# relative spelling from a post can name them: the blog plugin serves
# docs/blog/posts/X.md at /blog/YYYY/MM/DD/slug/, and a correct relative link
# escapes docs_root under path arithmetic that cannot know the permalink. An
# absolute path is the canonical reference -- it is what the feed itself emits
# (mkdocs.yml: stylesheet: /blog/rss.xsl) -- declared here rather than silenced.
absolute_path_allowlist = ["/blog/rss.xml", "/blog/rss-updated.xml"]

excluded_file_patterns = []

[governance]
# suppression_cap = 4: the directory-policy pairs this project defends, counted in use and
# measured on 2026-09-16 (`zenzic check all --audit`). One exempts the blog posts'
# unreachable-page finding; three keep tutorial pages that demonstrate the very finding
# they document. The twelve navigation pairs that stood here until 2026-09-16 are gone --
# see the note above the policy table. The default of 30 is not calibrated for any project
# -- it began as the free allowance of a retired scoring model -- so the cap is declared
# from what this project holds, and a new exemption lands only by raising it on purpose.
suppression_cap = 4

# Directory policies: each (pattern, code) pair that silences a finding costs one point and
# counts toward suppression_cap; a pair that silences nothing is reported (Z620).
[governance.directory_policies]
# `"docs/index.md" = ["Z502"]` was removed 2026-09-15. The short-content check became
# opt-in and defaults to off, so the entry suppressed nothing; the dead-policy report
# skips exactly this path by name, which is why it was never flagged.
"docs/blog/posts/**" = ["Z410"]
# Twelve pairs were retired on 2026-09-16: two Z402 and ten Z103. The engine now
# honours MkDocs' not_in_nav, which mkdocs.yml already declared for the ADR records
# and the release runbook, so those pages are reachable-by-intent rather than
# orphans — and with the targets no longer orphaned, the links into them stopped
# being orphan links too. All twelve stopped silencing anything and Z620 reported
# each one. The editorial argument they encoded is not abandoned: it now lives in
# docs/rules/Z103.md, where an instrument can read it and a reader can find it.
"docs/tutorials/examples/z5xx-content/**" = ["Z506"]
# z506's page opens with a deliberately malformed frontmatter delimiter ("--"
# instead of "---") -- that malformation IS the fixture. A side effect is that
# the "description:" line then parses as an H2 with no body, so Z512 fires on a
# heading the author never wrote. Suppressed for this one page: fixing it would
# mean repairing the delimiter, which would delete the demonstration.
"docs/tutorials/examples/z5xx-content/z506-malformed-frontmatter.md" = ["Z512"]
# z403's page still trips its own rule -- the image with no alt text IS the
# fixture -- so this stays. z501's twin entry was removed once the fence tracker
# began closing nested fences correctly: the placeholder words it suppressed are
# inside a fenced CLI transcript, which is no longer scanned as prose, so the
# suppression became dead configuration (Z620) rather than a needed exemption.
# z403's entry was removed on 2026-09-19 for the same reason z501's twin was:
# the page quotes a CLI transcript, the `![](diagram.png)` inside it is fenced,
# and Z403 now consults the fence tracker -- so the suppression stopped
# silencing anything and became Z620 dead configuration.
# These two pages quote the real CLI output for the rule they document, and that
# output necessarily contains the payload the rule detects: z501's capture shows
# the placeholder words it found, z403's shows the image tag missing its alt.
# The previous sanitised transcriptions avoided this by accident rather than by
# design -- they were also wrong about the glyphs, the severities and the counts.
# Same shape as Z205's rule page, which teaches a forbidden scheme by showing
# one: the demonstration is the content, and deleting it to satisfy the gate
# would delete the page's reason to exist.
