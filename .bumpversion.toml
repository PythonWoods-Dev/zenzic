[tool.bumpversion]
current_version = "0.30.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)((?P<pre_l>a|b|rc)(?P<pre_n>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.pre_l]
values = ["final", "a", "b", "rc"]
optional_value = "final"

[tool.bumpversion.parts.pre_n]
first_value = 1

[[tool.bumpversion.files]]
filename = "mkdocs.yml"
search = 'zenzic_version: "{current_version}"'
replace = 'zenzic_version: "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = '## \[Unreleased\](\s*\n\*Upcoming changes for the next release\.\*)?'
replace = '''## [Unreleased]

*Upcoming changes for the next release.*

## [{new_version}] - {now:%Y-%m-%d}'''
regex = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/zenzic/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "date-released: \\d{{4}}-\\d{{2}}-\\d{{2}}"
replace = "date-released: {now:%Y-%m-%d}"
regex = true

[[tool.bumpversion.files]]
filename = "src/zenzic/cli/_standalone.py"
search = 'dependencies = ["zenzic>={current_version}"]'
replace = 'dependencies = ["zenzic>={new_version}"]'


# Historical versioned documentation is tracked where explicit release
# markers are still present in the file body.

# Aggiornamento Tabella Metadati in RELEASE.md
[[tool.bumpversion.files]]
filename = "RELEASE.md"
search = "| Version  | v{current_version}"
replace = "| Version  | v{new_version}"

# Aggiornamento Checklist in RELEASE.md
[[tool.bumpversion.files]]
filename = "RELEASE.md"
search = "- [ ] `pyproject.toml` version matches the tag (`{current_version}`)"
replace = "- [ ] `pyproject.toml` version matches the tag (`{new_version}`)"

[[tool.bumpversion.files]]
filename = "RELEASE.md"
search = 'git tag -s -m "Release v{current_version}" v{current_version}'
replace = 'git tag -s -m "Release v{new_version}" v{new_version}'


[[tool.bumpversion.files]]
filename = "RELEASE.md"
search = '(?m)^(\| Date\s+\|\s+)\d{{4}}-\d{{2}}-\d{{2}}(\s*\|)$'
replace = '| Date     | {now:%Y-%m-%d} |'
regex = true

[[tool.bumpversion.files]]
filename = "RELEASE.md"
search = "- [ ] Create GitHub Release from the tag, using the `## [{current_version}]` CHANGELOG section as the release body."
replace = "- [ ] Create GitHub Release from the tag, using the `## [{new_version}]` CHANGELOG section as the release body."

[[tool.bumpversion.files]]
filename = ".github/ISSUE_TEMPLATE/security_vulnerability.yml"
search = 'placeholder: "{current_version}"'
replace = 'placeholder: "{new_version}"'

[[tool.bumpversion.files]]
filename = ".github/ISSUE_TEMPLATE/bug_report.yml"
search = 'placeholder: "{current_version}"'
replace = 'placeholder: "{new_version}"'

[[tool.bumpversion.files]]
# Phase 2: .pre-commit-hooks.yaml must be bumped atomically with core version.
# If this file is not updated, users pulling the hook will get a stale rev pointer.
# Governance Leak Fix (Release A audit): This was missing, forcing manual edits.
filename = ".pre-commit-hooks.yaml"
search = "rev: v{current_version}"
replace = "rev: v{new_version}"

[[tool.bumpversion.files]]
filename = "README.md"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = "uvx zenzic@{current_version} check all"
replace = "uvx zenzic@{new_version} check all"

[[tool.bumpversion.files]]
filename = "README.md"
search = "rev: v{current_version}"
replace = "rev: v{new_version}"

[[tool.bumpversion.files]]
filename = "README.md"
search = 'docs = ["zenzic~={current_version}"]'
replace = 'docs = ["zenzic~={new_version}"]'

# Manages the "Version baseline" annotation in the CLI reference so it never drifts.
[[tool.bumpversion.files]]
filename = "docs/reference/cli.md"
search = "**Version baseline: Zenzic v{current_version}**"
replace = "**Version baseline: Zenzic v{new_version}**"

[[tool.bumpversion.files]]
filename = "docs/editor/vscode.md"
search = "The VS Code Extension requires **Zenzic Core v{current_version} or higher**."
replace = "The VS Code Extension requires **Zenzic Core v{new_version} or higher**."

[[tool.bumpversion.files]]
filename = "docs/editor/vscode.md"
search = "- **Zenzic Core**: `v{current_version}` or higher."
replace = "- **Zenzic Core**: `v{new_version}` or higher."

[[tool.bumpversion.files]]
filename = "docs/editor/vscode.md"
search = "Installs `zenzic >= {current_version}` using"
replace = "Installs `zenzic >= {new_version}` using"

[[tool.bumpversion.files]]
filename = "docs/how-to/configure-ci-cd.md"
search = 'version: "{current_version}"'
replace = 'version: "{new_version}"'

[[tool.bumpversion.files]]
filename = "docs/how-to/configure-ci-cd.md"
search = "rev: v{current_version}"
replace = "rev: v{new_version}"

[[tool.bumpversion.files]]
filename = "docs/how-to/configure-ci-cd.md"
search = "uvx zenzic@{current_version} check all --ci"
replace = "uvx zenzic@{new_version} check all --ci"

[[tool.bumpversion.files]]
filename = "docs/how-to/configure-ci-cd.md"
search = "uvx zenzic@{current_version} check all --ci --format json"
replace = "uvx zenzic@{new_version} check all --ci --format json"

[[tool.bumpversion.files]]
filename = "docs/how-to/install.md"
search = "rev: v{current_version}"
replace = "rev: v{new_version}"

[[tool.bumpversion.files]]
filename = "docs/how-to/install.md"
search = '"zenzic~={current_version}"'
replace = '"zenzic~={new_version}"'

[[tool.bumpversion.files]]
filename = "docs/how-to/install.md"
search = "uvx zenzic@{current_version} check all"
replace = "uvx zenzic@{new_version} check all"

[[tool.bumpversion.files]]
filename = "src/zenzic/cli/templates.py"
search = "#     rev: v{current_version}"
replace = "#     rev: v{new_version}"
