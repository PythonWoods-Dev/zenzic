# .zenzic.toml — Z410 UNREACHABLE_GRAPH_NODE gallery example
#
# This sandbox uses the zensical engine so that the VSM topology check can
# inspect the navigation manifest. docs/secret.md exists on disk, has no
# incoming links, and is not in the navigation manifest — it is an
# unreachable graph node → Z410 UNREACHABLE_GRAPH_NODE.
#
# Expected results:
#   zenzic check all      → EXIT 1  (Z410 ×1 — docs/secret.md unreachable)

docs_dir = "docs"
fail_under = 0

[build_context]
engine = "zensical"
