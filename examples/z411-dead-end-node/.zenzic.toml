# .zenzic.toml — Z411 DEAD_END_NODE gallery example
#
# docs/deadend.md is linked from index.md but has no outgoing links of its
# own — it forms a structural dead end → Z411 DEAD_END_NODE.
#
# Expected results:
#   zenzic check all      → EXIT 1  (Z411 ×1 — docs/deadend.md is a dead end)

docs_dir = "docs"
fail_under = 0

[build_context]
engine = "zensical"

[governance.per_file_ignores]
"docs/suppressed_deadend.md" = ["Z411"]

# Z411 is opt-in: a licence page, a changelog and a glossary are dead ends by design.
# A fixture named for the code must enable it, or it demonstrates nothing --
# which is what tests/test_gallery_code_coverage.py caught when Z106's default
# changed and its own fixture stopped emitting it.
[policies]
enable_dead_end_check = true
