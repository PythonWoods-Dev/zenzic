# .zenzic.toml — Z411 DEAD_END_NODE gallery example
#
# docs/deadend.md is linked from index.md but has no outgoing links of its
# own — it forms a structural dead end → Z411 DEAD_END_NODE.
#
# Expected results:
#   zenzic check all      → EXIT 1  (Z411 ×1 — docs/deadend.md is a dead end)

docs_dir = "docs"
fail_under = 0

[build_context]
engine = "zensical"

[governance.per_file_ignores]
"docs/suppressed_deadend.md" = ["Z411"]
