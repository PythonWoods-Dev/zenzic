docs_dir = "docs"
fail_under = 0

[build_context]
engine = "standalone"

# Z106 is opt-in: a link cycle is documentation's ordinary shape (an index links
# its records, each record links back), so the check is off unless a project
# declares it wants an acyclic hierarchy. A fixture named for the code must
# enable it, or it demonstrates nothing -- which is what
# tests/test_gallery_code_coverage.py caught when the default changed.
[policies]
enable_circular_link_check = true
