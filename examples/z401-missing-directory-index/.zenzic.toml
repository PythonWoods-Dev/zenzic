# .zenzic.toml — Z401 MISSING_DIRECTORY_INDEX gallery example
#
# docs/guide/ contains guide/page.md but has no index.md.
# Visiting /guide/ in the built site will return a 404.
# Zenzic fires Z401 (info) — exit 0.  Run with --show-info to see it.
#
# Expected results:
#   zenzic check all             → EXIT 0  (Z401 ×1, suppressed as info)
#   zenzic check all --show-info → EXIT 0  (Z401 ×1 visible)

docs_dir = "docs"
fail_under = 0

[build_context]
engine = "zensical"

# Z401 is opt-in: not every generator uses directory indexes, and some serve a listing rather than a 404.
# A fixture named for the code must enable it, or it demonstrates nothing --
# which is what tests/test_gallery_code_coverage.py caught when Z106's default
# changed and its own fixture stopped emitting it.
[policies]
enable_directory_index_check = true
