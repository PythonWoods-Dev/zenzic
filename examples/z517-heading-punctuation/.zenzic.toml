# .zenzic.toml — Z517 HEADING_PUNCTUATION gallery example
#
# docs/index.md contains a heading ending with a period. Zenzic's built-in
# HeadingPunctuationRule (Z517) is always active and flags invalid trailing
# heading punctuation (., :, ;) — exit 1.
#
# Expected results:
#   zenzic check references   → EXIT 0  (Z517 ×1 — heading ends with punctuation)
#   zenzic check all       → EXIT 1

docs_dir = "docs"
fail_under = 0

[build_context]
engine = "standalone"

# Z517 is opt-in: trailing punctuation in a heading is a house style and renders correctly either way.
# A fixture named for the code must enable it, or it demonstrates nothing --
# which is what tests/test_gallery_code_coverage.py caught when Z106's default
# changed and its own fixture stopped emitting it.
[policies]
enable_heading_punctuation_check = true
