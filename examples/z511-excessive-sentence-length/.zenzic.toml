# .zenzic.toml — Z511 EXCESSIVE_SENTENCE_LENGTH gallery example
#
# docs/index.md contains a single prose sentence exceeding the default
# 40-word readability threshold. Zenzic's built-in ExcessiveSentenceLengthRule
# (Z511) is always active and flags overlong sentences — exit 1.
#
# Expected results:
#   zenzic check content   → EXIT 1  (Z511 ×1 — sentence exceeds word limit)
#   zenzic check all       → EXIT 1

docs_dir = "docs"
fail_under = 0

[build_context]
engine = "standalone"
