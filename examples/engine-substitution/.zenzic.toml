#
#   zenzic check all --format json   → payload carries engine.substituted = true
#
# This fixture declares an engine it does not have. `mkdocs` is named here and
# there is no `mkdocs.yml` beside it, so the factory replaces the adapter with
# StandaloneAdapter and the run reports what StandaloneAdapter reports.
#
# It exists because the substitution had only ever been visible as a notice on
# stderr, where no CI consumer reads. The `engine` object in the JSON payload
# and the run-level `engine` property in SARIF are what a pipeline can gate on,
# and `engine.reason` is emitted only in this state -- so without a fixture in
# it, the field is declared in the schema and produced by nothing the corpus
# exercises.
docs_dir = "docs"
fail_under = 0

[build_context]
engine = "mkdocs"
