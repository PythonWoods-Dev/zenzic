# .zenzic.toml — Z203 PATH_TRAVERSAL_FATAL gallery example
#
# docs/index.md contains two links to the same destination, one written
# plainly and one percent-encoded:
#   ../../../../etc/passwd
#   ..%2f..%2f..%2f..%2fetc%2fpasswd
# Escaping docs/ alone is Z202 (non-fatal, exit 1). Landing on a system root
# (etc, root, var, proc, sys, usr, bin, sbin, boot, dev, and the Windows
# names windows, winnt, system32, programdata) upgrades the finding to
# Z203 PATH_TRAVERSAL_FATAL — non-suppressible, exit 3. The href is decoded
# before classification, so encoding cannot hide the destination.
#
# Expected results:
#   zenzic check links   → EXIT 3  (Z203 ×2 — fatal path traversal, non-suppressible)
#   zenzic check all     → EXIT 3

docs_dir = "docs"
fail_under = 0

[build_context]
engine = "standalone"
