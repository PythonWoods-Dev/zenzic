# .zenzic.toml — Z513 DUPLICATE_HEADING gallery example
#
# docs/index.md contains two headings ("Configuration") that resolve to the
# exact same text. Zenzic's built-in DuplicateHeadingRule (Z513) is always
# active and flags duplicate heading text — exit 1.
#
# Expected results:
#   zenzic check references   → EXIT 0  (Z513 ×1 — duplicate heading text)
#   zenzic check all       → EXIT 1

docs_dir = "docs"
fail_under = 0

[build_context]
engine = "standalone"

# Z513 is opt-in: repeating a heading under several sections is legal Markdown and ordinary structure.
# A fixture named for the code must enable it, or it demonstrates nothing --
# which is what tests/test_gallery_code_coverage.py caught when Z106's default
# changed and its own fixture stopped emitting it.
[policies]
enable_duplicate_heading_check = true
