# Segregate stage execution: linters run at commit-time only.
# Any pre-push orchestrator must declare `stages: [pre-push]` explicitly.
default_stages: [pre-commit]

repos:
  # 1. Generic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
        exclude: ^examples/
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  # 2. Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: f295829140d25717bc79368d3f966fc1f67a824f  # v0.41.0
    hooks:
      - id: markdownlint
        exclude: ^examples/
        # Deliberately NOT --fix. `.markdownlint.json` sets `default: true`, so
        # every rule a future markdownlint release adds is enabled the moment
        # `rev` is bumped. With --fix that would silently rewrite files across
        # the corpus on the next run; without it, the same bump surfaces as a
        # reviewable failure and each new rule gets a deliberate disposition.

  # 3. Ruff (linting & formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25a8c8da6c24a3b9a1a536e2674683dd0eead5d6  # v0.11.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^examples/
      - id: ruff-format
        exclude: ^examples/

  # 4. Purge __pycache__ before REUSE — bytecode in untracked dirs fails the check
  - repo: local
    hooks:
      - id: clean-pycache
        name: Clean __pycache__ before REUSE lint
        entry: bash -c "find . -path './.git' -prune -o -name '__pycache__' -type d -print -exec rm -rf {} + 2>/dev/null || true"
        language: system
        pass_filenames: false
        always_run: true

  # 5. REUSE/SPDX license compliance
  - repo: https://github.com/fsfe/reuse-tool
    rev: 9fabf9eb815a57aac116b435e8346c200cdb8604  # v6.2.0
    hooks:
      - id: reuse

  # 6. Local: type checking
  - repo: local
    hooks:
      - id: mypy
        name: Type Checking (mypy)
        # language: system + uv run → uv reads pyproject.toml and installs all
        # [project.dependencies] including google-re2. No additional_dependencies
        # needed here (that's only for mirrors-mypy repo hooks that run in
        # isolated virtualenvs outside the project's uv-managed environment).
        entry: uv run mypy src/ tests/
        language: system
        types: [python]
        pass_filenames: false

  # 7. Local Dogfooding: Zenzic Secret Guard on staged Markdown/MDX
  #
  #     The guard is deliberately wider than the analysed corpus: it scans every
  #     staged Markdown/MDX file, including the 203 that live outside docs/ --
  #     README.md, CONTRIBUTING.md, SECURITY.md, .github/, scripts/, changelogs/.
  #     That breadth is the point, so it is not narrowed to the corpus.
  #
  #     Two paths are exempted here, and the exemption lives in this file rather
  #     than in .zenzic.toml or the engine. Both are fixtures whose whole purpose
  #     is to carry a credential the scanner detects -- examples/z201-credentials/
  #     demonstrates Z201 firing for the tutorial, and the hero_specimen sandbox
  #     backs the test suite -- so the scanner detects them and blocks every
  #     commit that touches them. These two are the complete set: of the 502
  #     tracked Markdown/MDX files, the guard flags exactly these and nothing
  #     else, checked by running it over all of them rather than by assuming.
  #     The engine must not grow a config-named
  #     exemption to accommodate that -- the security tier is never suppressible
  #     by any mechanism (discovery.py, iter_security_scan_sources), and a key
  #     that switches it off for one path is a general bypass with a narrow
  #     default. Excluding the path at the hook keeps the property intact: the
  #     fixtures are still scanned by `zenzic guard scan` run directly, still
  #     report their findings, and still exit 2. Only the commit gate skips
  #     them, visibly, in a file every diff shows.
  - repo: local
    hooks:
      - id: zenzic-guard
        name: zenzic guard (Secret Guard)
        entry: uv run zenzic guard scan --quiet --no-header
        language: system
        types_or: [markdown, mdx]
        exclude: ^(examples/z201-credentials/|tests/sandboxes/hero_specimen/docs/secrets\.md$)
        pass_filenames: true

  # 7a. Breaking-change marker (commit-msg stage -- the pre-commit stage never
  #     sees the message). Requires a `!` in the subject only when the count of
  #     BREAKING entries in CHANGELOG.md actually increases, so moving an entry
  #     between sections does not false-positive. Limits are stated in the
  #     script's own docstring rather than left to be discovered.
  - repo: local
    hooks:
      - id: breaking-change-marker
        name: Breaking-change marker (!) in the commit subject
        entry: python3 scripts/check_breaking_change_marker.py
        language: system
        stages: [commit-msg]
        always_run: true

  # 7b. Redirects tripwire — structural drift detector for docs/_redirects.
  #     Not a formatter: it never edits the file, it fails loudly when the file
  #     changes shape. Added after commit 36c5f70 silently gained 18 blank lines
  #     through the comment header with no identifiable vector.
  - repo: local
    hooks:
      - id: redirects-structure
        name: Redirects structure tripwire
        entry: python3 scripts/check_redirects_structure.py
        language: system
        files: ^docs/_redirects$
        pass_filenames: false

  # 7c. Blog link schedule — staggered-publication invariant for docs/blog/posts/.
  #     A live (non-draft) post must never link to a still-draft post: a real
  #     mkdocs build --strict stays clean either way, since the blog plugin just
  #     excludes drafts from the build rather than treating a link into one as
  #     broken. This is the only thing that actually enforces the schedule.
  - repo: local
    hooks:
      - id: blog-link-schedule
        name: Blog link schedule gate
        entry: python3 scripts/check_blog_link_schedule.py
        language: system
        files: ^docs/blog/posts/.*\.md$
        pass_filenames: false

  # 8. Final Guard — score gate + badge freshness + full audit (pre-push only)
  - repo: local
    hooks:
      - id: just-verify
        name: Final Guard (just verify)
        entry: just verify
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
